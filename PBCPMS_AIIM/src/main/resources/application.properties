spring.application.name=PBCPMS_AIIM
server.port=8080

# Local PostgreSQL (database: pbcpms)
spring.datasource.url=jdbc:postgresql://localhost:5432/pbcpms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
pbcpms_aiim.jwt.secret=PBCPMSAIIMSecretKey2024MustBeLongEnoughForHS256Algorithm
pbcpms_aiim.jwt.expiration-ms=86400000

# CORS – local Next.js + Vercel (override in production profile)
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Seed sample data on first empty database
app.seed.enabled=true
