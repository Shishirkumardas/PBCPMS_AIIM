# ===============================
# Application (active config — used on Render and when not swapped for local)
# For local: copy values from application-local.properties into this file.
# Reference templates: application-local.properties, application-render.properties
# ===============================
spring.application.name=PBCPMS_AIIM
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# PostgreSQL (set env vars on Render)
# DB_URL must be jdbc:postgresql://…  (postgres:// is auto-converted in main)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# JWT (MUST be at least 32 characters)
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# CORS / seed
# ===============================
cors.allowed-origins=https://pbcpms-aiim.vercel.app/
app.seed.enabled=${APP_SEED_ENABLED:true}
