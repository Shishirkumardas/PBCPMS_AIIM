# ===============================
# REFERENCE ONLY — not loaded by default (no spring.profiles.active=render).
# Copy into application.properties when deploying / for Render-style env vars.
# ===============================
spring.application.name=PBCPMS_AIIM
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL (Render env vars)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.seed.enabled=${APP_SEED_ENABLED:true}
