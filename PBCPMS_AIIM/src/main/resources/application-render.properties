# Render.com production profile
# Activate with: SPRING_PROFILES_ACTIVE=render
#
# Required Render environment variables:
#   DATABASE_URL          – Render Postgres (postgres://user:pass@host:port/db) OR
#   SPRING_DATASOURCE_URL – jdbc:postgresql://host:port/db
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (if not using DATABASE_URL alone)
#   JWT_SECRET            – long random string
#   CORS_ALLOWED_ORIGINS  – https://your-frontend.vercel.app

spring.application.name=PBCPMS_AIIM
server.port=${PORT:8080}

# Prefer explicit JDBC URL. If only DATABASE_URL is set (Render style),
# set SPRING_DATASOURCE_URL manually or use the Dockerfile start script converter.
# Example JDBC: jdbc:postgresql://dpg-xxx.render.com:5432/pbcpms
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pbcpms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:pbcpms}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

pbcpms_aiim.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-key-for-hs256}
pbcpms_aiim.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.seed.enabled=${APP_SEED_ENABLED:true}
