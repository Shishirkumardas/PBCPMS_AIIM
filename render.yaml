# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → select this repo
# Active config: PBCPMS_AIIM/src/main/resources/application.properties (no Spring profile required)
services:
  - type: web
    name: pbcpms-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SEED_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://pbcpms-aiim.vercel.app
      # application.properties uses DB_URL / DB_USERNAME / DB_PASSWORD
      # connectionString may be postgres://… — converted to JDBC in main
      - key: DB_URL
        fromDatabase:
          name: pbcpms-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: pbcpms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pbcpms-db
          property: password
      # Also expose raw Render URL for tools that expect DATABASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: pbcpms-db
          property: connectionString

databases:
  - name: pbcpms-db
    plan: free
    databaseName: pbcpms
    user: pbcpms
