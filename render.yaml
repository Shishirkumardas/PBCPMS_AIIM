# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → select this repo
services:
  - type: web
    name: pbcpms-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SEED_ENABLED
        value: "true"
      # Set after frontend is live, e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pbcpms-db
          property: connectionString

databases:
  - name: pbcpms-db
    plan: free
    databaseName: pbcpms
    user: pbcpms
